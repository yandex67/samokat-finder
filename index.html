<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<title>Поиск Самокатов</title>
<link rel="manifest" href="manifest.json">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Yandex+Sans+Text:wght@400;500;600;700&display=swap');
  
  * { 
    box-sizing: border-box; 
    margin: 0; 
    padding: 0; 
    font-family: 'Yandex Sans Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  
  body {
    background: #F5F5F5;
    color: #000;
    padding: 16px;
    min-height: 100vh;
    padding-bottom: 100px;
  }

  .profile-section {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .profile-avatar {
    width: 51px;
    height: 51px;
    border-radius: 50%;
  }

  .profile-name {
    font-size: 25px;
    font-weight: 700;
    color: #000;
  }

  .scooter-header {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #FFFFFF;
    padding: 16px 20px;
    border-radius: 16px;
    margin-bottom: 16px;
  }

  .scooter-icon {
    width: 44px;
    height: 44px;
  }

  .scooter-title {
    font-size: 20px;
    font-weight: 600;
    color: #000;
  }

  .rewards-card {
    background: #FFFFFF;
    padding: 16px 20px;
    border-radius: 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .rewards-content {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .rewards-star {
    width: 34px;
    height: 34px;
  }

  .rewards-text {
    font-size: 16px;
    color: #000;
  }

  .rewards-subtext {
    font-size: 13px;
    color: #999;
    margin-top: 2px;
  }

  .rewards-arrow {
    color: #999;
    font-size: 20px;
  }

  .action-button {
    background: #FFFFFF;
    padding: 18px 20px;
    border-radius: 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    border: none;
    width: 100%;
    font-size: 17px;
    font-weight: 500;
    color: #000;
    transition: background 0.2s;
  }

  .action-button:active {
    background: #F0F0F0;
  }

  .action-button-content {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .action-icon-wrapper {
    width: 43px;
    height: 43px;
    background: #F0F0F0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .action-icon {
    width: 22px;
    height: 22px;
    object-fit: contain;
  }

  .action-arrow {
    color: #999;
    font-size: 20px;
  }

  .street-section {
    background: #FFFFFF;
    padding: 20px;
    border-radius: 16px;
    margin-bottom: 16px;
  }

  .street-label {
    font-size: 17px;
    font-weight: 500;
    color: #000;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  .street-sublabel {
    font-size: 13px;
    color: #999;
    font-weight: 400;
  }

  .street-input {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    background: #F5F5F5;
    outline: none;
    transition: all 0.2s;
    min-height: 96px;
    resize: none;
    display: block;
  }

  .street-input:focus {
    border: 2px solid #FFCC00;
    background: #FFFFFF;
  }

  .street-input::placeholder {
    color: #999;
  }

  .photo-card {
    background: #FFFFFF;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
    min-height: 280px;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .photo-placeholder {
    color: #999;
    font-size: 15px;
  }

  .photo-card img.photo-preview {
    width: 100%;
    border-radius: 12px;
    object-fit: cover;
  }

  .submit-btn {
    background: #FFCC00;
    color: #000;
    border: none;
    padding: 18px 20px;
    border-radius: 16px;
    font-size: 17px;
    font-weight: 600;
    width: 100%;
    cursor: pointer;
    margin-bottom: 8px; /* УМЕНЬШЕНО ДЛЯ СБЛИЖЕНИЯ КНОПОК */
    transition: opacity 0.2s;
  }

  .submit-btn:active {
    opacity: 0.8;
  }

  .submit-btn:disabled {
    background: #E0E0E0;
    color: #999;
    cursor: not-allowed;
  }

  .retake-btn {
    background: #e5e4e2;
    color: #000;
    border: none;
    padding: 18px 20px; /* Выровняли padding с кнопкой Отправить */
    border-radius: 16px;
    font-size: 17px;
    font-weight: 600; /* СДЕЛАЛИ ЖИРНЫМ КАК У КНОПКИ "ОТПРАВИТЬ" */
    width: 100%;
    cursor: pointer;
    margin-bottom: 20px;
    transition: background 0.2s;
    display: none; /* СКРЫТА ПО УМОЛЧАНИЮ */
  }

  .retake-btn:active {
    background: #dcdad8;
  }

  .logout-btn {
    background: #FFFFFF;
    padding: 18px 20px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    border: none;
    width: 100%;
    font-size: 17px;
    font-weight: 500;
    color: #000;
    transition: background 0.2s;
    margin-bottom: 20px;
  }

  .logout-btn:active {
    background: #F0F0F0;
  }

  .logout-btn-content {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logout-icon-wrapper {
    width: 43px;
    height: 43px;
    background: #F0F0F0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logout-icon {
    width: 18px;
    height: 18px;
    object-fit: contain;
  }

  .logout-arrow {
    color: #999;
    font-size: 20px;
  }

  #status {
    margin: 0 0 8px 0; /* Минимальный отступ. Если текст пустой, места почти не занимает */
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    line-height: 1.4;
    min-height: 0; /* ГАРАНТИРУЕТ СХЛОПЫВАНИЕ ПУСТОГО БЛОКА */
  }
  .ok { color: #16a34a; }
  .err { color: #dc2626; }
</style>
</head>
<body>

<div class="profile-section">
  <img src="icons/logoprofil.png" alt="Профиль" class="profile-avatar">
  <div class="profile-name">Пользователь</div>
</div>

<div class="scooter-header">
  <img src="icons/logosamokat.png" alt="Самокат" class="scooter-icon">
  <div class="scooter-title">Нашёл Самокат ?</div>
</div>

<div class="rewards-card">
  <div class="rewards-content">
    <img src="icons/star.png" alt="Звезда" class="rewards-star">
    <div>
      <div class="rewards-text">0 Бонусов</div>
      <div class="rewards-subtext">Бонусы = Рубли</div>
    </div>
  </div>
  <div class="rewards-arrow">›</div>
</div>

<button class="action-button" id="cameraBtn">
  <div class="action-button-content">
    <div class="action-icon-wrapper">
      <img src="icons/camera.png" alt="Камера" class="action-icon">
    </div>
    <span>Сфотографировать</span>
  </div>
  <div class="action-arrow">›</div>
</button>

<button class="action-button" id="galleryBtn">
  <div class="action-button-content">
    <div class="action-icon-wrapper">
      <img src="icons/gallery.png" alt="Галерея" class="action-icon">
    </div>
    <span>Загрузить из галереи</span>
  </div>
  <div class="action-arrow">›</div>
</button>

<input type="file" id="cameraInput" accept="image/*" capture="environment" style="display: none;">
<input type="file" id="fileInput" accept="image/*" style="display: none;">

<div class="street-section">
  <div class="street-label">Название улицы:<br><span class="street-sublabel">(рядом с которой обнаружен самокат)</span></div>
  <textarea class="street-input" id="street" placeholder="Например: ул. Ленина, 15" rows="3"></textarea>
</div>

<div class="photo-card" id="photoCard">
  <div class="photo-placeholder" id="photoPlaceholder">Здесь появится фото</div>
  <img id="photoPreview" class="photo-preview" style="display: none;">
</div>

<button class="submit-btn" id="sendBtn">Отправить</button>

<div id="status"></div>

<button class="retake-btn" id="retakeBtn">Переснять</button>

<button class="logout-btn" id="logoutBtn">
  <div class="logout-btn-content">
    <div class="logout-icon-wrapper">
      <img src="icons/logout.png" alt="Выход" class="logout-icon">
    </div>
    <span>Выход</span>
  </div>
  <div class="logout-arrow">›</div>
</button>

<script>
const BOT_TOKEN = '9010811030:AAH6QLyJ-mifNvJHrR4nD3SAj9S6-twrWMA';
const CHAT_ID   = '7929131842';

const photoCard = document.getElementById('photoCard');
const photoPlaceholder = document.getElementById('photoPlaceholder');
const photoPreview = document.getElementById('photoPreview');
const cameraBtn = document.getElementById('cameraBtn');
const galleryBtn = document.getElementById('galleryBtn');
const cameraIn = document.getElementById('cameraInput');
const fileIn = document.getElementById('fileInput');
const streetIn = document.getElementById('street');
const sendBtn = document.getElementById('sendBtn');
const retakeBtn = document.getElementById('retakeBtn');
const logoutBtn = document.getElementById('logoutBtn');
const status = document.getElementById('status');

let currentFile = null;

function showPreview(file) {
  currentFile = file;
  const reader = new FileReader();
  reader.onload = e => {
    photoPlaceholder.style.display = 'none';
    photoPreview.src = e.target.result;
    photoPreview.style.display = 'block';
    photoCard.style.display = 'block';
    
    // ПОКАЗЫВАЕМ кнопку "Переснять"
    retakeBtn.style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function clearPreview() {
  currentFile = null;
  photoPlaceholder.style.display = 'block';
  photoPreview.src = '';
  photoPreview.style.display = 'none';
  cameraIn.value = '';
  fileIn.value = '';
  status.textContent = '';
  photoCard.style.display = 'none';
  
  // СКРЫВАЕМ кнопку "Переснять"
  retakeBtn.style.display = 'none';
}

// Кнопка "Сфотографировать" открывает ТОЛЬКО камеру
cameraBtn.addEventListener('click', () => { 
  cameraIn.value = ''; // Сброс для корректной работы
  cameraIn.click(); 
});

// Кнопка "Галерея" открывает ТОЛЬКО галерею
galleryBtn.addEventListener('click', () => { 
  fileIn.value = ''; 
  fileIn.click(); 
});

cameraIn.addEventListener('change', e => { 
  if (e.target.files[0]) showPreview(e.target.files[0]); 
});

fileIn.addEventListener('change', e => { 
  if (e.target.files[0]) showPreview(e.target.files[0]); 
});

// При нажатии "Переснять": очищаем и сразу открываем КАМЕРУ
retakeBtn.addEventListener('click', () => {
  clearPreview();
  // Небольшая задержка, чтобы интерфейс успел обновиться перед вызовом камеры
  setTimeout(() => {
    cameraIn.value = '';
    cameraIn.click(); 
  }, 50);
});

sendBtn.addEventListener('click', async () => {
  status.className = '';
  if (!currentFile) { 
    status.textContent = 'Сначала сделайте фото'; 
    status.className = 'err'; 
    return; 
  }
  if (!streetIn.value.trim()) { 
    status.textContent = 'Укажите улицу'; 
    status.className = 'err'; 
    return; 
  }

  sendBtn.disabled = true;
  status.textContent = 'Отправляем...';

  try {
    const fd = new FormData();
    fd.append('chat_id', CHAT_ID);
    fd.append('photo', currentFile);
    
    const captionText = `🛴 *Новая находка!*\n📍 Улица: ${streetIn.value.trim()}\n🕒 ${new Date().toLocaleString('ru-RU')}`;
    
    fd.append('caption', captionText);
    fd.append('parse_mode', 'Markdown');

    const r1 = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: 'POST', 
      body: fd
    });
    
    const j1 = await r1.json();
    if (!j1.ok) throw new Error(j1.description || 'Ошибка отправки фото');

    // НОВОЕ СООБЩЕНИЕ ОБ УСПЕХЕ
    status.innerHTML = 'Спасибо за информацию!<br>После одобрения заявки, вам начислят бонусы.';
    status.className = 'ok';
    
    clearPreview();
    streetIn.value = '';

    // АВТОМАТИЧЕСКИЙ ВЫХОД ЧЕРЕЗ 6 СЕКУНД
    setTimeout(() => {
      logoutBtn.click();
    }, 6000);

  } catch (err) {
    status.textContent = 'Ошибка: ' + err.message;
    status.className = 'err';
  } finally {
    sendBtn.disabled = false;
  }
});

logoutBtn.addEventListener('click', () => {
  if (navigator.app) {
    navigator.app.exitApp();
  } else {
    window.close();
    setTimeout(() => { alert('Закройте вкладку браузера для выхода из приложения'); }, 100);
  }
});
</script>
</body>
</html>
